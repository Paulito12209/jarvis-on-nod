[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-stimme"
version = "0.4.0"
description = "Schneller, komplett lokaler Sprachassistent auf Deutsch (Whisper + Ollama + Piper)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pysilero-vad>=3.0",
    "piper-tts>=1.3",
    "ddgs>=9.0",
    "pillow>=10; sys_platform != 'darwin'",
    "pillow-heif>=0.18; sys_platform != 'darwin'",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jarvis-stimme = "jarvis_stimme.__main__:main"

[tool.setuptools]
packages = ["jarvis_stimme"]

[tool.setuptools.package-data]
jarvis_stimme = ["gui.html"]
